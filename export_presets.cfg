html/head_include="<script>(function(){function show(m){var d=document.getElementById('mh_err');if(!d){d=document.createElement('div');d.id='mh_err';d.style.cssText='position:fixed;top:0;left:0;right:0;max-height:45%;overflow:auto;background:#b00020;color:#fff;font:12px/1.3 monospace;padding:6px;z-index:99999;white-space:pre-wrap';document.body.appendChild(d);}d.textContent+=new Date().toLocaleTimeString()+'  '+m+'\n';}window.addEventListener('error',function(e){show('ERROR: '+(e.message||e)+' @ '+(e.filename||'')+':'+(e.lineno||''));});window.addEventListener('unhandledrejection',function(e){show('REJECTION: '+(e.reason&&e.reason.message?e.reason.message:e.reason));});var ce=console.error;console.error=function(){try{show('CONSOLE.ERROR: '+Array.prototype.join.call(arguments,' '));}catch(_){};ce.apply(console,arguments);};var cw=console.warn;console.warn=function(){try{var s=Array.prototype.join.call(arguments,' ');if(/WATCHDOG|forzato|SCRIPT ERROR|USER ERROR|WebGL|CONTEXT|GL_|memory|audio/i.test(s))show('WARN: '+s);}catch(_){};cw.apply(console,arguments);};var cl=console.log;console.log=function(){try{var s=Array.prototype.join.call(arguments,' ');if(/WebGL|CONTEXT_LOST|SCRIPT ERROR|ERROR:|memory/i.test(s))show('LOG: '+s);}catch(_){};cl.apply(console,arguments);};})();</script>"
